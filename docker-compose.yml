services:
  backend:
    build: ./backend
    container_name: sajilo-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    container_name: sajilo-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend