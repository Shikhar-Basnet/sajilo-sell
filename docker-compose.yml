services:
  postgres:
    image: postgres:16-alpine
    container_name: sajilo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sajilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sajilo_password}
      POSTGRES_DB: ${POSTGRES_DB:-sajilo_sell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sajilo} -d ${POSTGRES_DB:-sajilo_sell}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sajilo-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/alembic:/app/alembic

  frontend:
    build: ./frontend
    container_name: sajilo-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: